[tools]
bun = "1.4.2"
act = "0.2.89"
hk = "2.5.0"

[tasks.install]
description = "Install JavaScript dependencies and Git hooks"
run = "bun install && hk install --mise"

[tasks.check]
description = "Run repository checks"
run = "bun run check"

[tasks.check-actions]
description = "Build local Docker Action image, verify the harness contract, and run act fixtures"
run = "bun run check:actions"
