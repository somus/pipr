[tools]
bun = "1.4.0"
act = "0.2.89"
hk = "1.56.1"

[tasks.install]
description = "Install JavaScript dependencies and Git hooks"
run = "bun install && hk install --mise"

[tasks.check]
description = "Run repository checks"
run = "bun run check"

[tasks.check-actions]
description = "Build local Docker Action image, verify Pi contract, and run act fixtures"
run = "bun run check:actions"
