name: pipr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: |
      ${{
        (
          github.event_name != 'pull_request' ||
          !startsWith(github.head_ref, 'release-please--')
        ) &&
        !(
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, 'Created releases:') &&
          contains(github.event.comment.body, '/releases/tag/')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: somus/pipr@v0.9.1
        id: pipr
        env:
          MERGE_GATEWAY_API_KEY: ${{ secrets.MERGE_GATEWAY_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PIPR_RUN_AGE_RECIPIENTS: ${{ vars.PIPR_RUN_AGE_RECIPIENTS }}
      - name: Upload Pipr run bundle
        if: always() && steps.pipr.outputs.run-bundle-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pipr.outputs.run-artifact-name }}
          path: ${{ steps.pipr.outputs.run-bundle-path }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
