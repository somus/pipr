name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

env:
  PIPR_GHCR_ACTION_IMAGE: ghcr.io/somus/pipr
  PIPR_TEST_ACTION_IMAGE: pipr-action:e2e

jobs:
  resolve:
    permissions:
      contents: read
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PIPR_COMMIT_SUBJECT: ${{ github.event.workflow_run.head_commit.message }}
          PIPR_EVENT_NAME: ${{ github.event_name }}
          PIPR_INPUT_TAG: ${{ inputs.tag }}
          PIPR_WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bun scripts/release.ts resolve

  publish:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PIPR_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM || 'pipr' }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.PIPR_RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - if: github.event_name == 'workflow_dispatch'
        run: bun run check
      - name: Verify release tag metadata
        id: version
        run: bun scripts/release.ts verify-tag
      - run: bun run build:release:cli
      - run: bun run check:release-artifacts
      - run: bun run check:npm-tarballs
      - run: bun run docker:e2e
      - run: npm publish "dist/npm/usepipr-sdk-${{ steps.version.outputs.version }}.tgz" --access public
      - run: npm publish "dist/npm/usepipr-runtime-${{ steps.version.outputs.version }}.tgz" --access public
      - run: npm publish "dist/npm/usepipr-cli-${{ steps.version.outputs.version }}.tgz" --access public
      - run: |
          gh release upload "$PIPR_RELEASE_TAG" \
            dist/release/pipr-linux-x64 \
            dist/release/pipr-linux-arm64 \
            dist/release/pipr-darwin-x64 \
            dist/release/pipr-darwin-arm64 \
            dist/release/SHA256SUMS \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.PIPR_GHCR_ACTION_IMAGE }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Publish GHCR image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dogfood:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.PIPR_RELEASE_PLEASE_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Open dogfood SDK update PR
        env:
          GH_TOKEN: ${{ secrets.PIPR_RELEASE_PLEASE_TOKEN }}
          PIPR_RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: bun scripts/release.ts dogfood
